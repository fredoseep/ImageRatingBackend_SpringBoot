<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>光影评分 · 人工工作台</title>
<style>
:root{font-family:system-ui,sans-serif;color:#e7eaf0;background:#10151d}*{box-sizing:border-box}body{margin:0 auto;max-width:1180px;padding:32px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:27px;margin:10px 0}p{color:#aab6c8;line-height:1.7}.pill{font-size:13px;border:1px solid #39465b;border-radius:50px;padding:8px 14px;color:#b9c4d7}.toolbar{padding:22px;background:#1b2431;border-radius:16px;margin:25px 0;display:flex;gap:12px;flex-wrap:wrap;align-items:center}input,textarea,button{font:inherit;border-radius:9px;padding:11px;border:1px solid #43536b;background:#131d2a;color:#fff}button{background:#c6f37b;color:#182410;border:0;cursor:pointer;font-weight:650}button.secondary{background:#34435b;color:white}button:disabled{opacity:.5;cursor:default}.toolbar input{flex:1;min-width:200px}#error{color:#ffb7a9;white-space:pre-wrap}#tasks{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}.card{border:1px solid #303d52;background:#192332;border-radius:16px;overflow:hidden}.photo{width:100%;height:260px;object-fit:contain;background:#090e14}.body{padding:18px}.label{font-size:12px;color:#c6f37b;letter-spacing:1px}.desc{white-space:pre-wrap;word-break:break-word;color:#d2dbea}textarea{width:100%;margin:12px 0;resize:vertical;min-height:76px}.row{display:flex;gap:10px;align-items:center}.row input{width:110px}.result{white-space:pre-wrap;color:#b9c8df;font-size:14px}.empty{padding:50px;text-align:center;border:1px dashed #40516c;border-radius:16px;color:#aebbd0}footer{margin-top:35px;color:#8091aa;font-size:13px}
</style>
<header><div><span class="label">IMAGE RATING LAB / LOCAL</span><h1>光影评分 · 人工工作台</h1></div><span id="status" class="pill">未接单</span></header>
<p>点击“开始接单”后保持此页面打开。每 3 秒发送心跳；心跳消失 15 秒或任务超时，手机将收到回退指令。</p>
<label for="key" style="display:block;margin-top:24px;color:#e7eaf0;font-weight:650">管理员密钥（复制 Spring Boot 启动控制台中“管理员密钥:”后面的内容）</label>
<div class="toolbar" style="margin-top:10px"><input id="key" type="password" aria-label="管理员密钥" placeholder="在这里粘贴管理员密钥，再点击开始接单" autocomplete="off"><button id="start">开始接单</button><button id="stop" class="secondary">暂停接单</button><button id="refresh" class="secondary">刷新记录</button></div>
<p id="error" role="alert"></p><div id="tasks"><div class="empty">尚未加载任务。开始接单后，在 Android 端上传一张图片。</div></div>
<footer>人工评分范围 0–100 · 最多显示最近 100 条 · 图片与人工结果保存在电脑 · DeepSeek 在手机端调用</footer>
<script>
const $=id=>document.getElementById(id), session=crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();
let accepting=false,busy=false,stopping=false,generation=0,heartbeat=Promise.resolve(); const cards=new Map();
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+$('key').value.trim(),...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});if(!r.ok){let x=await r.json();throw Object.assign(Error(x.error||r.status),{status:r.status})}return r.json()}
function state(text){$('status').textContent=text;$('start').disabled=accepting||stopping;$('key').disabled=accepting}
function node(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
async function image(id,img){try{const r=await fetch('/api/admin/tasks/'+id+'/image',{headers:{Authorization:'Bearer '+$('key').value.trim()}});if(!r.ok)throw Error('图片加载失败');const url=URL.createObjectURL(await r.blob());if(img.isConnected){img.src=url;img.dataset.url=url}else URL.revokeObjectURL(url)}catch(e){img.alt=e.message}}
function render(data){const ids=new Set(data.tasks.map(t=>t.id));for(const [id,c] of cards){if(!ids.has(id)){if(c.img.dataset.url)URL.revokeObjectURL(c.img.dataset.url);c.el.remove();cards.delete(id)}}
if(data.tasks.length)$('tasks').querySelector('.empty')?.remove();
for(const t of data.tasks){let c=cards.get(t.id);if(!c){const el=node('article','card'),img=node('img','photo');img.alt='待评图片';const b=node('div','body'),label=node('div','label'),desc=node('p','desc',t.description||'未填写图片描述'),meta=node('p','result',new Date(t.created*1000).toLocaleString()+' · '+t.id.slice(0,8)),score=node('input'),comment=node('textarea'),button=node('button','', '提交人工评分'),row=node('div','row'),result=node('p','result');score.type='number';score.min='0';score.max='100';score.step='0.1';score.placeholder='0–100';comment.placeholder='评分理由或建议';row.append(score,button);b.append(label,desc,meta,row,comment,result);el.append(img,b);$('tasks').append(el);c={el,img,label,score,comment,button,result};cards.set(t.id,c);image(t.id,img);button.onclick=async()=>{try{if(!score.value.trim())throw Error('请先填写分数');button.disabled=true;await api('/api/admin/tasks/'+t.id+'/rate',{score:Number(score.value),comment:comment.value});await load()}catch(e){$('error').textContent=e.message}finally{button.disabled=c.currentStatus!=='pending'}}}
c.currentStatus=t.status;c.label.textContent=t.status==='pending'?'等待人工评分':t.status==='rated'?'人工评分完成':'已交给手机回退';c.button.disabled=t.status!=='pending';c.score.disabled=t.status!=='pending';c.comment.disabled=t.status!=='pending';c.result.textContent=t.status==='rated'?t.score+' / 100\n'+t.comment:t.status==='fallback'?'原因：'+({operator_offline:'无人接单',human_timeout:'人工等待超时'}[t.reason]||t.reason):'剩余 '+Math.max(0,Math.ceil(t.deadline-data.now))+' 秒';}
}
async function load(){render(await api('/api/admin/tasks'))}
async function tick(){if(busy||!accepting)return;busy=true;const g=generation;try{heartbeat=api('/api/admin/heartbeat',{session,online:true});await heartbeat;if(g!==generation)return;state('正在接单 · 已连接');await load();$('error').textContent=''}catch(e){if(g!==generation)return;if(e.status===401){accepting=false;generation++;state('密钥错误 · 请重新输入');$('key').focus()}else state('连接异常 · 等待重试');$('error').textContent=e.message}finally{busy=false}}
$('start').onclick=()=>{if(stopping)return;if(!$('key').value.trim()){$('error').textContent='请在上方输入框填写后端启动控制台显示的管理员密钥';$('key').focus();return;}$('error').textContent='';accepting=true;generation++;state('正在连接');tick()};
$('stop').onclick=async()=>{if(stopping)return;stopping=true;accepting=false;generation++;state('正在暂停接单');try{await heartbeat.catch(()=>{});await api('/api/admin/heartbeat',{session,online:false});await load()}catch(e){$('error').textContent=e.message}finally{stopping=false;state('已暂停接单')}};
$('refresh').onclick=()=>load().catch(e=>$('error').textContent=e.message);
setInterval(tick,3000);
// No unload dependency: closing/crashing the tab expires its server-side lease.
</script></html>
